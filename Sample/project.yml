name: CiaoSample
options:
  bundleIdPrefix: com.altavares.ciao
  deploymentTarget:
    iOS: '18.0'
    macOS: '15.0'
packages:
  Ciao:
    path: ..
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
targets:
  CiaoSample_iOS:
    type: application
    platform: iOS
    sources: [CiaoSample]
    dependencies:
      - package: Ciao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.altavares.ciao.sample.ios
        TARGETED_DEVICE_FAMILY: '1,2'
    info:
      path: iOS-Info.plist
      properties:
        CFBundleDisplayName: Ciao Sample
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Ciao discovers and publishes demonstration Bonjour services on your local network.
        NSBonjourServices: [_ciao-demo._tcp, _ciao-demo._udp]
  CiaoSample_macOS:
    type: application
    platform: macOS
    sources: [CiaoSample]
    dependencies:
      - package: Ciao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.altavares.ciao.sample.macos
        ENABLE_APP_SANDBOX: YES
    info:
      path: macOS-Info.plist
      properties:
        CFBundleDisplayName: Ciao Sample
        NSLocalNetworkUsageDescription: Ciao discovers and publishes demonstration Bonjour services on your local network.
        NSBonjourServices: [_ciao-demo._tcp, _ciao-demo._udp]
    entitlements:
      path: CiaoSample.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
